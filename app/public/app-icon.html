<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=512, height=512">
  <title>Sodoku Stake - App Icon</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 512px;
      height: 512px;
    }
    
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
    }
    
    .grid-container {
      position: relative;
      width: 380px;
      height: 380px;
      background: #3d3427;
      border-radius: 32px;
      padding: 8px;
      box-shadow: 0 8px 0 #c9b896;
    }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
      height: 100%;
    }
    
    .cell {
      background: #fef6e4;
      border-radius: 8px;
    }
    
    /* Dollar sign overlay */
    .dollar-sign {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 180px;
      font-weight: 700;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #4a9d5b;
      text-shadow: 
        -5px -5px 0 #3d3427,
        5px -5px 0 #3d3427,
        -5px 5px 0 #3d3427,
        5px 5px 0 #3d3427,
        -6px 0 0 #3d3427,
        6px 0 0 #3d3427,
        0 -6px 0 #3d3427,
        0 6px 0 #3d3427;
    }
  </style>
</head>
<body>
  <div class="grid-container">
    <div class="grid">
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
    </div>
    <div class="dollar-sign">$</div>
  </div>
</body>
</html>
