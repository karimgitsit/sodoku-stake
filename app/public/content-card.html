<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1035, height=720">
  <title>Sodoku Stake - Content Card</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 1035px;
      height: 720px;
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #1e3a5f 0%, #0f172a 50%, #1e293b 100%);
      position: relative;
      overflow: hidden;
    }
    
    /* Decorative background elements */
    .bg-grid {
      position: absolute;
      top: 50%;
      right: -50px;
      transform: translateY(-50%);
      opacity: 0.15;
    }
    
    .grid-pattern {
      display: grid;
      grid-template-columns: repeat(9, 40px);
      gap: 2px;
    }
    
    .grid-cell {
      width: 40px;
      height: 40px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.5);
    }
    
    /* Glow effects */
    .glow-1 {
      position: absolute;
      top: 0;
      left: 0;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.4) 0%, transparent 70%);
      filter: blur(60px);
    }
    
    .glow-2 {
      position: absolute;
      bottom: 100px;
      right: 100px;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(22, 163, 74, 0.3) 0%, transparent 70%);
      filter: blur(50px);
    }
    
    /* Main content */
    .content {
      position: relative;
      z-index: 10;
      height: 100%;
      padding: 60px 80px;
      padding-bottom: 282px; /* Reserve bottom 94px × 3 for overlay */
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    
    .logo-row {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .logo-icon {
      font-size: 72px;
    }
    
    .app-name {
      font-size: 64px;
      font-weight: 700;
      color: white;
      letter-spacing: -1px;
    }
    
    .tagline {
      font-size: 32px;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 40px;
      font-weight: 500;
    }
    
    .features {
      display: flex;
      gap: 40px;
    }
    
    .feature {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.1);
      padding: 16px 28px;
      border-radius: 50px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    
    .feature-icon {
      font-size: 28px;
    }
    
    .feature-text {
      font-size: 22px;
      color: white;
      font-weight: 600;
    }
    
    /* Mini sudoku grid in corner */
    .mini-grid {
      position: absolute;
      bottom: 320px;
      right: 80px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      transform: rotate(-5deg);
    }
    
    .mini-cell {
      width: 60px;
      height: 60px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
      color: white;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .mini-cell.highlight {
      background: rgba(37, 99, 235, 0.6);
      border-color: rgba(37, 99, 235, 0.8);
    }
    
    .mini-cell.success {
      background: rgba(22, 163, 74, 0.6);
      border-color: rgba(22, 163, 74, 0.8);
    }
    
    /* Prize badge */
    .prize-badge {
      position: absolute;
      top: 60px;
      right: 80px;
      background: linear-gradient(135deg, #16a34a, #22c55e);
      padding: 20px 36px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(22, 163, 74, 0.4);
    }
    
    .prize-text {
      font-size: 18px;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 4px;
    }
    
    .prize-amount {
      font-size: 36px;
      font-weight: 700;
      color: white;
    }
    
    /* Overlay area indicator (for design reference - remove in production) */
    .overlay-area {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 282px;
      /* border-top: 2px dashed rgba(255, 255, 255, 0.2); */
      /* This area will be covered by World App overlay */
    }
  </style>
</head>
<body>
  <div class="glow-1"></div>
  <div class="glow-2"></div>
  
  <div class="content">
    <div class="logo-row">
      <span class="logo-icon">🧩</span>
      <span class="app-name">Sodoku Stake</span>
    </div>
    
    <p class="tagline">Stake $1 • Solve Daily Puzzles • Win Real Money</p>
    
    <div class="features">
      <div class="feature">
        <span class="feature-icon">🎯</span>
        <span class="feature-text">New Puzzle Daily</span>
      </div>
      <div class="feature">
        <span class="feature-icon">💰</span>
        <span class="feature-text">Win from Prize Pool</span>
      </div>
      <div class="feature">
        <span class="feature-icon">🌍</span>
        <span class="feature-text">World ID Verified</span>
      </div>
    </div>
  </div>
  
  <div class="mini-grid">
    <div class="mini-cell">5</div>
    <div class="mini-cell highlight">3</div>
    <div class="mini-cell">4</div>
    <div class="mini-cell">6</div>
    <div class="mini-cell success">7</div>
    <div class="mini-cell">2</div>
    <div class="mini-cell highlight">1</div>
    <div class="mini-cell">9</div>
    <div class="mini-cell">8</div>
  </div>
  
  <div class="prize-badge">
    <p class="prize-text">Today's Pool</p>
    <p class="prize-amount">$677</p>
  </div>
  
  <div class="overlay-area"></div>
</body>
</html>
